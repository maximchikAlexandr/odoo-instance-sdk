[project]
name = "odoo-instance-sdk"
version = "0.1.0"
description = "A typed Python SDK for managing local Odoo 19.0 instances: process lifecycle, CLI commands, readiness checks, and database operations via standard HTTP API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "maximchikAlexandr", email = "maximchik.alexandr@yandex.ru" },
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "msgspec>=0.18,<1.0",
    "platformdirs>=4.3,<5",
    "click>=8.2,<9",
    "json5>=0.15,<1",
]

[project.optional-dependencies]
metrics = ["psutil>=5.9,<7"]
dashboard = [
    "odoo-instance-sdk[metrics]",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
odcli = "odoo_instance_sdk.cli:cli"

[project.urls]
Source = "https://github.com/maximchikAlexandr/odoo-instance-sdk"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Built React assets (web/dist/) live under the module root and are included
# automatically in sdist + wheel. Exclude the Node.js dependency tree and
# sources from the distributions to keep them lean; Node.js is not required
# at runtime — the built SPA in web/dist/ is all that ships.
source-exclude = ["src/odoo_instance_sdk/web/node_modules/**"]
wheel-exclude = ["src/odoo_instance_sdk/web/node_modules/**"]

[dependency-groups]
lint = ["ruff>=0.15"]
type-check = ["mypy>=2.0"]
test = [
    "pytest>=8.0",
    "pytest-httpx>=0.30,<1.0",
    "pytest-cov>=5",
    "pytest-xdist>=3,<4",
    "pytest-timeout>=2.4,<3",
]
mutation = ["mutmut>=3,<4"]
dev = [
    {include-group = "lint"},
    {include-group = "type-check"},
    {include-group = "test"},
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
timeout = 60
timeout_method = "signal"
addopts = "-v --tb=short --strict-markers -m \"not real_odoo and not packaging\""
markers = [
    "unit: isolated unit tests",
    "integration: offline integration with local fake HTTP, PostgreSQL, or process boundaries",
    "packaging: package artifact and isolated-install checks",
    "serial: must run without xdist parallelism",
    "real_odoo: opt-in disposable lifecycle test requiring explicit local Odoo prerequisites",
]
filterwarnings = [
    "error",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore:--include is ignored because --source is set:coverage.exceptions.CoverageWarning",
]

[tool.coverage.run]
source = ["odoo_instance_sdk"]
branch = true
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
show_missing = true

[tool.coverage.regexs]
cli = "odoo_instance_sdk/(cli\\.py|internal/cli_output\\.py)$"
process = "odoo_instance_sdk/(internal/server\\.py|internal/health\\.py|resources/instance\\.py)$"
environment = "odoo_instance_sdk/(resources/environment\\.py|internal/git_worktree\\.py|internal/doctor\\.py)$"
catalog = "odoo_instance_sdk/(resources/database\\.py|storage/backup_catalog\\.py)$"
security = "odoo_instance_sdk/internal/(redact|sanitize|db_name|urls|address)\\.py$"
postgres = "odoo_instance_sdk/(resources/postgres\\.py|internal/postgres_compose\\.py)$"
monitor = "odoo_instance_sdk/(resources/monitor\\.py|internal/(process_metrics|git_activity|storage_footprint|cluster_resources|postgres_size|serve)\\.py)$"

[tool.coverage.thresholds]
cli = 71
process = 74
environment = 76
catalog = 92
security = 94
postgres = 80
monitor = 80

[tool.coverage.branch_thresholds]
cli = 53
process = 59
environment = 57
catalog = 83
security = 89
postgres = 70
monitor = 70

[tool.mutmut]
source_paths = [
    "src/odoo_instance_sdk/internal/redact.py",
    "src/odoo_instance_sdk/internal/sanitize.py",
    "src/odoo_instance_sdk/internal/db_name.py",
    "src/odoo_instance_sdk/internal/urls.py",
    "src/odoo_instance_sdk/internal/address.py",
]
pytest_add_cli_args = ["-x", "-q"]
pytest_add_cli_args_test_selection = [
    "tests/unit",
    "-m",
    "not real_odoo and not packaging and not serial",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["fastapi", "fastapi.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = false
