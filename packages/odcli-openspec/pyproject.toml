[project]
name = "odcli-openspec"
version = "0.1.0"
description = "Bind an OpenSpec change to an OdCLI environment and report its progress."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "odoo-instance-sdk>=0.1.0,<0.2",
    "click>=8.2,<9",
]

[project.scripts]
odcli-openspec = "odcli_openspec.cli:main"

[project.entry-points."odoo_instance_sdk.environment_facts"]
openspec = "odcli_openspec.facts:load_provider"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.uv.sources]
odoo-instance-sdk = { workspace = true }

[dependency-groups]
test = ["pytest>=8.0"]
lint = ["ruff>=0.16.7,<0.17"]
type-check = ["mypy>=2.0"]

[tool.mypy]
strict = true
