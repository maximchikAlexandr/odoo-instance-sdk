[project]
name = "odcli-fixture-provider"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["odoo-instance-sdk"]

[project.entry-points."odoo_instance_sdk.operations"]
fixture = "odcli_fixture_provider.provider"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odcli_fixture_provider"]
