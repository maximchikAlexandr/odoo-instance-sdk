target-version = "py312"
line-length = 100

[lint]
select = [
    "BLE", "C", "E", "F", "FA", "FLY", "G", "I", "ICN", "ISC",
    "LOG", "PGH", "PIE", "PLC", "PLE", "PLW", "PYI", "RET", "RUF",
    "SIM", "SLOT", "T", "TC", "TID", "TRY", "UP", "W", "YTT",
]
ignore = [
    "COM812",
    "E501",
    "EM101",
    "EM102",
    "PLC0415",
    "TC001",
    "TC003",
    "BLE001",
    "TRY003",
    "T201",
    "PYI034",
    "PYI046",
    "PYI047",
    "UP046",
    "UP047",
]

[lint.per-file-ignores]
"src/odoo_instance_sdk/internal/database_preparation.py" = ["PLC0414"]
"src/odoo_instance_sdk/internal/database_replacement.py" = ["PLC0414"]
"src/odoo_instance_sdk/models/__init__.py" = ["PLC0414"]
"src/odoo_instance_sdk/internal/doctor/__init__.py" = ["E402"]
"src/odoo_instance_sdk/resources/database/__init__.py" = ["E402"]
"src/odoo_instance_sdk/resources/monitor/__init__.py" = ["E402"]
"src/odoo_instance_sdk/resources/postgres/__init__.py" = ["E402"]
"src/odoo_instance_sdk/resources/environment/__init__.py" = ["E402"]
"src/odoo_instance_sdk/resources/instance/__init__.py" = ["E402"]

[lint.isort]
known-first-party = ["odoo_instance_sdk"]

[format]
docstring-code-format = true
