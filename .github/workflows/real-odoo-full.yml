name: Real Odoo full E2E

on:
  push:
    branches:
      - agent/planner/a451a6ea752f
    paths:
      - ".github/workflows/real-odoo-full.yml"
      - ".github/workflows/real-odoo-tier.yml"
      - "scripts/real_odoo_*.py"
      - "src/odoo_instance_sdk/**"
      - "tests/integration/real_odoo/**"
      - "tests/fixtures/**"
      - "tests/fixtures/real_odoo/**"
      - "uv.lock"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "Run the full E2E tier or regenerate the reviewed dependency locks"
        type: choice
        options:
          - full
          - refresh-dependencies
        default: full
        required: true
      mode:
        description: "Select project-removal proof, focused nodes, or the full tier"
        type: choice
        options:
          - project-removal
          - targeted
          - full
        default: full
        required: true

permissions:
  contents: read

jobs:
  real-odoo-targeted:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'full' && inputs.mode != 'full')
    uses: ./.github/workflows/real-odoo-tier.yml
    with:
      mode: ${{ github.event_name == 'push' && 'targeted' || inputs.mode }}

  real-odoo-full:
    needs: real-odoo-targeted
    if: >-
      always() &&
      (github.event_name != 'push' || needs.real-odoo-targeted.result == 'success') &&
      (github.event_name != 'workflow_dispatch' || (inputs.operation != 'refresh-dependencies' && inputs.mode == 'full'))
    uses: ./.github/workflows/real-odoo-tier.yml
    with:
      mode: full

  refresh-real-odoo-dependencies:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'refresh-dependencies'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: "3.12.13"
          version: "0.13.4"
          enable-cache: false
      - name: Verify immutable Odoo source and reviewed overrides
        run: |
          set -euo pipefail
          source_cache=.cache/odoo-source-refresh
          mkdir -p .artifacts/real-odoo-dependency-refresh
          git init --bare "$source_cache"
          git -C "$source_cache" fetch --depth=1 https://github.com/odoo/odoo.git cd992ceebbaf343c03e1941d39cfe423d35ba6c6
          resolved_commit=$(git -C "$source_cache" rev-parse --verify 'FETCH_HEAD^{commit}')
          echo "fetched_source_commit=$resolved_commit"
          test "$resolved_commit" = cd992ceebbaf343c03e1941d39cfe423d35ba6c6
          git -C "$source_cache" show cd992ceebbaf343c03e1941d39cfe423d35ba6c6:requirements.txt > /tmp/odoo19-requirements.txt
          echo "requirements_sha256=$(shasum -a 256 /tmp/odoo19-requirements.txt | cut -d' ' -f1)"
          cp tests/fixtures/real_odoo/odoo19-linux-amd64-py3.12.overrides.txt /tmp/odoo19-overrides.txt
          chmod 600 /tmp/odoo19-requirements.txt /tmp/odoo19-overrides.txt
          echo "overrides_sha256=$(shasum -a 256 /tmp/odoo19-overrides.txt | cut -d' ' -f1)"
          uv_version=$(uv --version | awk '{print $2}')
          echo "uv_version=$uv_version"
          test "$uv_version" = 0.13.4
          uv run --no-project --python 3.12.13 python -c 'import platform,sys; assert sys.version_info[:3] == (3,12,13); assert platform.machine() == "x86_64"'
          echo "odoo_source_commit=cd992ceebbaf343c03e1941d39cfe423d35ba6c6"
          echo "python_version=$(uv run --no-project --python 3.12.13 python --version)"
      - name: Regenerate pinned locks and run the real pinned audit scanner
        run: |
          set -euo pipefail
          output=.artifacts/real-odoo-dependency-refresh
          cp tests/fixtures/real_odoo/odoo19-linux-amd64-py3.12.lock "$output/odoo19-linux-amd64-py3.12.lock"
          uv pip compile /tmp/odoo19-requirements.txt \
            --output-file "$output/odoo19-linux-amd64-py3.12.lock" \
            --override /tmp/odoo19-overrides.txt \
            --python-version 3.12 \
            --python-platform x86_64-manylinux_2_17 \
            --generate-hashes \
            --no-header \
            --upgrade-package certifi \
            --upgrade-package pillow \
            --upgrade-package urllib3 \
            --upgrade-package werkzeug
          generated_lock="$output/odoo19-linux-amd64-py3.12.lock"
          {
            printf '%s\n' \
              '# Reviewed hash lock for Odoo 19 pinned source, CPython 3.12, and x86_64 manylinux.' \
              '# Generated by uv from pinned Odoo requirements with reviewed compatibility overrides; see the adjacent audit manifest.'
            cat "$generated_lock"
          } > "$generated_lock.with-header"
          mv "$generated_lock.with-header" "$generated_lock"
          uv lock --upgrade-package certifi
          cp uv.lock "$output/uv.lock"
          cp /tmp/odoo19-overrides.txt "$output/odoo19-overrides.txt"
          set +e
          uvx --from pip-audit==2.10.1 pip-audit \
            -r "$output/odoo19-linux-amd64-py3.12.lock" \
            --format json --no-deps --disable-pip --require-hashes --strict \
            --desc off --aliases off > "$output/pip-audit.json"
          audit_exit=$?
          set -e
          printf '%s\n' "$audit_exit" > "$output/pip-audit-exit-code.txt"
          PYTHONPATH=. uv run --no-project --python 3.12.13 python scripts/real_odoo_refresh_audit.py \
            --lock "$output/odoo19-linux-amd64-py3.12.lock" \
            --scanner-report "$output/pip-audit.json" \
            --output "$output/odoo19-linux-amd64-py3.12.audit.json"
          PYTHONPATH=. uv run --no-project --python 3.12.13 python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          root = Path(".artifacts/real-odoo-dependency-refresh")
          lock = (root / "odoo19-linux-amd64-py3.12.lock").read_text()
          expected = {"certifi": "2026.10.19", "pillow": "13.0.0", "urllib3": "2.8.0", "werkzeug": "3.1.9"}
          actual = {name: version for name, version in re.findall(r"(?m)^([A-Za-z0-9_.-]+)==([^\s\\]+)", lock)}
          assert {name: actual.get(name) for name in expected} == expected
          project_lock = tomllib.loads((root / "uv.lock").read_text())
          project_versions = {item["name"]: item["version"] for item in project_lock["package"]}
          assert project_versions.get("certifi") == "2026.10.19", project_versions.get("certifi")
          print("fixture_versions=" + repr({name: actual[name] for name in expected}))
          print("repository_certifi=" + project_versions["certifi"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: real-odoo-dependency-refresh
          path: .artifacts/real-odoo-dependency-refresh
          retention-days: 7
