name: Notify merge conflicts

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: notify-merge-conflicts-main
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONFLICT_BASE_BRANCH: main
      GITHUB_TOKEN: ${{ github.token }}
      MULTICA_CONFLICT_WEBHOOK_URL: ${{ secrets.MULTICA_CONFLICT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/notify_merge_conflicts.py
