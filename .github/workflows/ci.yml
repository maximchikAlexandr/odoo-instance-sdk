name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  real-odoo-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_CACHE_DIR: .cache/uv
      ODCLI_E2E_SECRET_REGISTRY: .artifacts/real-odoo-e2e-secret-registry.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/real-odoo-smoke
        with:
          cache_class: cold

  real-odoo-smoke-warm:
    needs: real-odoo-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_CACHE_DIR: .cache/uv
      ODCLI_E2E_SECRET_REGISTRY: .artifacts/real-odoo-e2e-secret-registry.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/real-odoo-smoke
        with:
          cache_class: warm

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group lint
      - run: make lint

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group type-check
      - run: make types

  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group test --all-packages
      - run: make test
      - run: uv run pytest -q -o addopts='' packages/odcli-multica/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage.xml
            coverage.json
          retention-days: 14

  osv-lock-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: --lockfile=uv.lock
      results-file-name: uv-lock-results.sarif
      upload-sarif: false
      fail-on-vuln: true

  dashboard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/odoo_instance_sdk/web/package-lock.json
      - run: uv sync --frozen --group test --extra dashboard
      - run: cd src/odoo_instance_sdk/web && npm ci
      - run: test ! -d src/odoo_instance_sdk/web/dist
      - run: make web-codegen-check
      - run: cd src/odoo_instance_sdk/web && npm test
      - run: cd src/odoo_instance_sdk/web && npm run build
      - run: uv run pytest -q -o addopts='' -m dashboard
      - run: uv run pytest -q -o addopts='' tests/unit/test_http_contract.py::test_external_same_origin_mutation_accepts_secure_csrf
      - run: make smoke

  compatibility:
    timeout-minutes: 20
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - if: runner.os == 'macOS'
        name: Install PostgreSQL client
        run: |
          brew install libpq
          echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen --group test
      - run: make compat

  windows-prepare-venv:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group test
      - run: uv run pytest -q -o addopts='' -o timeout_method=thread tests/unit/project/test_prepare_venv.py tests/unit/test_integrated_init_venv.py -k 'real_platform_backend or integrated or init_help'

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/odoo_instance_sdk/web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group test
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  odcli-codex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-packages --group lint --group type-check --group test
      - run: uv run ruff check packages/odcli-codex src/odoo_instance_sdk/codex_integration.py src/odoo_instance_sdk/catalog_validation.py src/odoo_instance_sdk/commands/plain_line.py
      - run: uv run ruff format --check packages/odcli-codex src/odoo_instance_sdk/codex_integration.py src/odoo_instance_sdk/catalog_validation.py src/odoo_instance_sdk/commands/plain_line.py
      - run: uv run mypy --strict packages/odcli-codex/src
      - run: uv run pytest -q -o addopts='' packages/odcli-codex/tests
      - run: uv run pytest -q -o addopts='' tests/unit/test_odcli_codex.py
      - run: uv build --package odoo-instance-sdk --no-sources --out-dir dist/core
      - run: uv build --package odcli-codex --no-sources --out-dir dist/odcli-codex
      - name: Compare core-only and core-plus-extension help
        run: |
          set -euo pipefail
          uv venv --python 3.12 /tmp/odcli-core
          uv pip install --python /tmp/odcli-core/bin/python dist/core/*.whl
          /tmp/odcli-core/bin/odcli git commit --help | grep -F -- '--generate'
          /tmp/odcli-core/bin/odcli translations export --help | grep -F -- '--auto-translate'
          if /tmp/odcli-core/bin/python -c "import odcli_codex"; then
            echo "core-only install imported odcli_codex" >&2
            exit 1
          fi
          uv venv --python 3.12 /tmp/odcli-both
          uv pip install --python /tmp/odcli-both/bin/python dist/core/*.whl dist/odcli-codex/*.whl
          /tmp/odcli-both/bin/odcli-codex --help
          /tmp/odcli-both/bin/odcli git commit --help | grep -F -- '--generate'
