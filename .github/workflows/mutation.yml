name: Mutation Testing

on:
  schedule:
    - cron: "0 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: targets
        run: echo "matrix=$(python scripts/mutation_report.py matrix)" >> "$GITHUB_OUTPUT"

  mutation:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group mutation --group test
      - run: make mutation
        env:
          MUTATION_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-results-${{ matrix.shard }}
          path: .artifacts/mutation/results.txt
          if-no-files-found: error
          retention-days: 14

  aggregate:
    if: always()
    needs:
      - prepare
      - mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutation-results-*
          path: .artifacts/mutation/reports
      - name: Validate aggregate mutation report
        run: >-
          python scripts/mutation_report.py aggregate
          --reports-dir .artifacts/mutation/reports
          --summary .artifacts/mutation/summary.txt
          --baseline .github/mutation-baseline.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-summary
          path: .artifacts/mutation/summary.txt
          if-no-files-found: error
          retention-days: 14
